<section class="bg-gray-50 dark:bg-gray-900">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
    <a class="flex items-center mb-6 text-2xl font-semibold text-gray-900 dark:text-white">
      <img
        src="https://dislicoresqa.vtexassets.com/assets/vtex/assets-builder/dislicoresqa.storetheme/5.19.100/images/logo/white___7f22f326ef79fd21fd53b8612a034aef.svg"
        alt=""
      />
    </a>
    <div class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
      <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
          Crear Supervisor
        </h1>

        <!-- ✅ ALERTA DE USUARIO REGISTRADO -->
        <div *ngIf="userCreated" class="bg-green-100 text-green-700 px-4 py-2 rounded text-sm">
          Usuario registrado exitosamente
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4 md:space-y-6">
          <div>
            <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nombre</label>
            <input
              type="email"
              formControlName="email"
              id="email"
              placeholder="John Doe"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
            />
            <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-red-600 text-xs">
              Email inválido.
            </div>
          </div>

                    <div>
            <label for="Apellido" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Apellido</label>
            <input
              type="email"
              formControlName="email"
              id="email"
              placeholder="Doe Smith"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
            />
            <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-red-600 text-xs">
              Email inválido.
            </div>
          </div>
                  <div>
            <label for="Apellido" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Cedula</label>
            <input
              type="email"
              formControlName="email"
              id="email"
              placeholder="N° de cedula"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
            />
            <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-red-600 text-xs">
              Email inválido.
            </div>
          </div>

          <div>
            <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
            <input
              type="email"
              formControlName="email"
              id="email"
              placeholder="nombre@gmail.com"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
            />
            <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-red-600 text-xs">
              Email inválido.
            </div>
          </div>

          <div>
            <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Contraseña</label>
            <input
              type="password"
              formControlName="password"
              id="password"
              placeholder="••••••••"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
            />
            <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-red-600 text-xs">
              La contraseña debe tener mínimo 8 caracteres.
            </div>
          </div>

          <div>
            <label for="confirmPassword" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Confirmar contraseña</label>
            <input
              type="password"
              formControlName="confirmPassword"
              id="confirmPassword"
              placeholder="••••••••"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
            />
            <div *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched" class="text-red-600 text-xs">
              Las contraseñas no coinciden.
            </div>
          </div>

          <div class="flex items-start">
            <div class="flex items-center h-5">
              <input
                id="terms"
                type="checkbox"
                formControlName="terms"
                class="w-4 h-4 border border-gray-300 rounded bg-gray-50"
              />
            </div>
            <div class="ml-3 text-sm">
              <label for="terms" class="font-light text-gray-500 dark:text-gray-300">
                Acepto los <a class="font-medium text-primary-600 hover:underline dark:text-primary-500">Términos y condiciones</a>
              </label>
            </div>
          </div>
          <div *ngIf="registerForm.get('terms')?.invalid && registerForm.get('terms')?.touched" class="text-red-600 text-xs">
            Debes aceptar los términos y condiciones.
          </div>

          <button
            type="submit"
            [disabled]="registerForm.invalid"
            class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-base px-6 py-3 text-center shadow-md disabled:bg-gray-400 disabled:cursor-not-allowed"
            routerLink="/auth/login" 
          >
            Crear cuenta
          </button>

          <p class="text-sm font-light text-gray-500 dark:text-gray-400">
            Ya tengo cuenta?
            <a routerLink="/auth/login" class="font-medium text-primary-600 hover:underline dark:text-primary-500">Ingresa aquí</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
