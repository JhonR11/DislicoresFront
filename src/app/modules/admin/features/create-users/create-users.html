
<div class="relative overflow-x-auto shadow-md sm:rounded-lg">


    <div class="my-4 flex items-center justify-between">
        <button (click)="openModal()" class="cursor-pointer text-white bg-gradient-to-r from-green-400 via-green-500 to-green-600 hover:bg-gradient-to-br shadow-green-500/50 dark:shadow-lg dark:shadow-green-800/80 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2 ">Crear Usuario
        </button>
        <modal-create-user [isOpen]="ModalOpen" (close)="closeModal()" (save)="onSave($event)"></modal-create-user>
        
    </div>

    <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400 border-collapse border border-black">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
            <tr>
                <th scope="col" class="p-4">
                </th>
                <th scope="col" class="px-6 py-3">
                    Nombre Usuario
                </th>
                <th scope="col" class="px-6 py-3">
                    Apellido
                </th>
                <th scope="col" class="px-6 py-3">
                    Numero Documento
                </th>
                <th scope="col" class="px-6 py-3">
                    Telefono
                </th>
                <th scope="col" class="px-6 py-3">
                    Estado
                </th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of userService.users()" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
                <td class="w-4 p-4">
                </td>
                <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                    {{ item.name }}
                </th>
                <td class="px-6 py-4">
                    {{ item.lastname }}
                </td>
                <td class="px-6 py-4">
                    {{ item.documentNumber }}
                </td>
                <td class="px-6 py-4">
                    {{ item.phone }}
                </td>
                <td class="px-6 py-4">
                    {{ item.isActive ? 'Activo' : 'Inactivo' }}
                </td>
                
                <td class="flex items-center px-6 py-4">
                    <a class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Edit</a>
                    <a class="font-medium text-red-600 dark:text-red-500 hover:underline ms-3">Remove</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
